set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind '"'
unbind %

bind-key C-r source-file ~/.tmux.conf \; display "Config Reloaded !"

set -g mouse on

# Windows/panes start at 1 (matches keyboard order) and renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Bigger scrollback (tmux caps its own buffer; the terminal's scrollback is bypassed inside tmux)
set -g history-limit 50000

# vi-style copy mode with system-clipboard integration (OSC 52; supported by ghostty)
setw -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

bind-key f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
# Session switcher: recency-sorted popup; Prefix+S then Enter jumps to the previous session
bind-key S display-popup -E -w 60% -h 50% "~/.local/scripts/tmux-switch-session"
# New session from a recent directory (zoxide)
bind-key N display-popup -E -w 70% -h 50% "~/.local/scripts/tmux-session-new"

# Pane navigation is handled by vim-tmux-navigator (C-h/j/k/l, seamless with nvim splits).
# See the plugin declaration below.

unbind-key x               # unbind-key “x” from it’s current job of “ask and then close”
bind-key x kill-pane       # rebind-key it to just “close”
bind-key X kill-session    # key combo for killing the entire session -


# Set the default terminal mode to 256color mode with true-color (24-bit) support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Set terminal window title to show session: window
set-option -g set-titles on
set-option -g set-titles-string '#S: #W'
# Pane divider
set-window-option -g pane-border-style fg=colour11
set-window-option -g pane-active-border-style fg=colour118

# tmux adds a short, almost imperceptible delay between the commands that can cause funny behavior when running vim inside tmux.
set-option -s escape-time 0

# Highlight windows with activity (underscored name), but don't interrupt with a status message
setw -g monitor-activity on
set -g visual-activity off

setw -g window-status-style "NONE,fg=#7e8188"
setw -g window-status-activity-style "underscore,fg=#7e8188"

# Auto-rename windows to current directory basename
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Status bar: always show the current session name on the left
set -g status-left '#[bold]#S #[default]| '
set -g status-left-length 30
set -g status-right-length 50
set -g status-right 'Continuum status: #{continuum_status}'

#plugins
#set -g @plugin "articicestudio/nord-tmux"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
#set -g @plugin 'rose-pine/tmux'

#reload config 
bind r source-file ~/.tmux.conf

run '~/.tmux/plugins/tpm/tpm'

